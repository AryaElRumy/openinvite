[project]
name = "fastapi-edge-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.2",
    "bson>=0.5.10",
    "fastapi>=0.117.1",
    "loguru>=0.7.3",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.11.0",
    "pyinstaller>=6.16.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "reportlab>=4.4.5",
    "ruff>=0.13.1",
    "scalar-fastapi>=1.4.2",
    "sqlmodel>=0.0.25",
    "tenacity>=9.1.2",
    "uvicorn>=0.37.0",
]

[tool.ruff]
line-length = 88
lint.select = [
    "E",
    "W",
    "F",
    "I"
]
