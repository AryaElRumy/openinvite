[project]
name = "openinvite"
version = "0.1.0"
description = "Open-source invitation management system powered by AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.2",
    "bson>=0.5.10",
    "email-validator>=2.3.0",
    "fastapi>=0.117.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.4.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.33",
    "reportlab>=4.4.5",
    "ruff>=0.13.1",
    "scalar-fastapi>=1.4.2",
    "sqlmodel>=0.0.25",
    "tenacity>=9.1.2",
    "uvicorn>=0.37.0",
]

[tool.ruff]
line-length = 88
lint.select = [
    "E",
    "W",
    "F",
    "I"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
